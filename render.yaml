services:
  - type: web
    name: asgard-party-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://worldsource93.github.io
      - key: ADMIN_USER_IDS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "0"
